# Full stack: dashboard + presenter worker. Every live session gets its own
# sandbox container, started by the worker through the Docker socket.
#
#   cp .env.example .env    # fill in the keys
#   docker compose build    # also builds the sandbox image
#   docker compose up
#
# Then open http://localhost:3000/signup to create the first account.

name: onboarding-ai

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      AGENT_CALLBACK_BASE_URL: http://web:3000
      DATABASE_URL: postgres://onboard:onboard@postgres:5432/onboard
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: onboard
      POSTGRES_DB: onboard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboard -d onboard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    environment:
      SANDBOX_PROVIDER: docker
      SANDBOX_IMAGE: onboard-sandbox:latest
      SANDBOX_DOCKER_NETWORK: onboarding-ai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - web
    restart: unless-stopped

  # Build-only service: produces the per-session desktop image the worker runs.
  sandbox-image:
    image: onboard-sandbox:latest
    build:
      context: .
      dockerfile: packages/sandbox/Dockerfile
    profiles: ["build"]

networks:
  default:
    name: onboarding-ai

volumes:
  postgres-data:
