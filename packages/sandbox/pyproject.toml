[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboard-sandbox"
version = "0.1.0"
description = "Isolated virtual desktop (Xvfb + Chromium) with human-like OS-level mouse/keyboard input and live screen streaming"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# The client and providers only need aiohttp; the server needs the extras.
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
server = ["onboard-humanize", "python-xlib>=0.33", "mss>=9", "Pillow>=10"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
onboard-sandbox = "onboard_sandbox.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onboard_sandbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
