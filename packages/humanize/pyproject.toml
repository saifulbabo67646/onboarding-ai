[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboard-humanize"
version = "0.1.0"
description = "Human-like mouse trajectories, presenter gestures and typing cadence for computer-use agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/onboard_humanize"]
