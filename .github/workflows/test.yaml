name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system packages for the sandbox integration test
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install packages
        run: |
          pip install -e packages/humanize -e "packages/sandbox[server,test]" \
            -e "packages/director[test]" -e "apps/agent[test]"
      - run: pytest -q packages/humanize/tests
      - run: pytest -q packages/sandbox/tests
        env:
          # Ubuntu 24.04 runners block the user namespaces Chrome's own sandbox needs.
          CHROME_NO_SANDBOX: '1'
      - run: pytest -q packages/director/tests
      - run: pytest -q apps/agent/tests
