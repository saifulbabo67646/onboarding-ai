[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboard-agent"
version = "0.1.0"
description = "LiveKit worker that joins meetings, shares a sandbox desktop and presents with onboard-director"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "onboard-director",
  "onboard-sandbox",
  "livekit-agents>=1.8",
  "livekit-plugins-deepgram>=1.8",
  "livekit-plugins-elevenlabs>=1.8",
  "livekit-plugins-silero>=1.8",
  "python-dotenv>=1.0",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
onboard-agent = "onboard_agent.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onboard_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
